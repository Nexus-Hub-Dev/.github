name: Org Stats (atividade + linguagens)

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC (00:00 em Brasília)
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Gerar heatmap agregado da organização
        env:
          ORG: Nexus-Hub-Dev
          # Se a org tiver repositórios PRIVADOS, crie um secret ORG_PAT
          # (fine-grained: Contents=Read, Metadata=Read, em todos os repos da org)
          # e salve em: Settings > Secrets and variables > Actions.
          # Se for tudo público, o GITHUB_TOKEN padrão já resolve.
          GH_TOKEN: ${{ secrets.ORG_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/org-activity.mjs

      - name: Gerar gráfico de linguagens agregado
        env:
          ORG: Nexus-Hub-Dev
          GH_TOKEN: ${{ secrets.ORG_PAT || secrets.GITHUB_TOKEN }}
        run: node scripts/org-top-langs.mjs

      - name: Conferir arquivos gerados
        run: |
          echo "Conteúdo de profile/ após a geração:"
          ls -la profile/
          echo "--- tamanho dos arquivos ---"
          wc -c profile/org-activity.svg profile/top-langs.svg

      - name: Commitar SVGs gerados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/org-activity.svg profile/top-langs.svg
          if git diff --cached --quiet; then
            echo "Nada mudou, nada para commitar."
          else
            git commit -m "chore: atualiza atividade e linguagens da organização"
            git push
          fi
